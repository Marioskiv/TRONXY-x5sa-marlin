# Owner's new [extruder] section (pasted 2026-11-13): Creality K2 Plus hotend + HGX extruder.
# Review notes: docs/research/k2-hgx-extruder-review.md
[extruder]
step_pin: PB4
dir_pin: !PB5
enable_pin: !PB8

microsteps: 32
rotation_distance: 22.678
gear_ratio: 9.54647:1

nozzle_diameter: 0.400
filament_diameter: 1.750

heater_pin: PG12
sensor_type: creality_k2plus_350
sensor_pin: PA1

min_temp: 0
max_temp: 360
min_extrude_temp: 170

max_extrude_only_distance: 100

control: pid

[thermistor creality_k2plus_350]
temperature1: 25
resistance1: 260000
temperature2: 220
resistance2: 738
temperature3: 350
resistance3: 98
