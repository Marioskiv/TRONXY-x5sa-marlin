# Tronxy X5SA Pro (330 bed, 6 bed screws: 3 front, 3 rear), probe x_offset -35, y_offset 0.
# Screw positions from the official Klipper X5SA Pro template [bed_screws] (5/165/325, 5/325),
# converted to nozzle coordinates (nozzle X = screw X + 35). Right-hand screws: X limited to 350,
# so the probe lands ~10 mm left of those screws (Klipper accepts "as close as possible").
# Thread CW-M3: used by every community X5SA config found (justheath, dung-adumbs, iamSiiN, marcin-polo).
# Verify once: run SCREWS_TILT_CALCULATE and watch that the probe stops above each screw.
# 2026-11-13 v2: points moved inward. The inductive probe read wrong at Y=5 / Y=325 / probe X=5 because
# part of the sensor face was beyond the edge of the steel PEI sheet (edge effect). Probe now stays >= 20 mm
# inside the sheet (same area as bed_mesh 20..310); nozzle X = probe X + 35.
[screws_tilt_adjust]
screw1: 55, 20
screw1_name: front left
screw2: 200, 20
screw2_name: front middle
screw3: 345, 20
screw3_name: front right
screw4: 345, 310
screw4_name: rear right
screw5: 200, 310
screw5_name: rear middle
screw6: 55, 310
screw6_name: rear left
horizontal_move_z: 10
speed: 100
screw_thread: CW-M3
